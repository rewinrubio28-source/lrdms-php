[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/lrdms-supervisord.pid

[program:apache]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:ocr-worker]
directory=/var/www/html
command=/bin/sh -c "php database/migrate_ocr_jobs.php && exec php bin/ocr_worker.php"
user=www-data
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=110

[program:report-worker]
directory=/var/www/html
command=php bin/report_worker.php
user=www-data
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=110
